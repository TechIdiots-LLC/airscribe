      #         '. + [{name: $n, url: $u, direct_asset_path: ("/" + $n), link_type: "package"}]' <<< "$links")
      #     done
      #     name="AirScribe v$VERSION"
      #     [ "${{ needs.release-check.outputs.prerelease }}" = "true" ] && name="$name (pre-release)"
