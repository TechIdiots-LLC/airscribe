name: Create bump version PR

# Actions > Create bump version PR > Run workflow: bumps package.json's version (and package-lock.json's), rolls
# CHANGELOG.md's "## master" section into it (build/bump_version.py, which the GitLab bump-version job runs too) and
# opens a pull request. Merging it to main releases the new version (release.yml).

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version bump type.
        required: true
        type: choice
        options: [patch, minor, major, prepatch, preminor, premajor, prerelease]
      preid:
        description: Prerelease identifier (e.g. alpha, beta, rc). Only used with the pre* types.
        required: false
        type: string
        default: 'rc'

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    name: Bump version PR
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Bump version and changelog
        id: bump
        run: python build/bump_version.py "${{ inputs.version }}" "${{ inputs.preid }}"
      - uses: peter-evans/create-pull-request@v8
        with:
          commit-message: Release v${{ steps.bump.outputs.version }}
          branch: release-v${{ steps.bump.outputs.version }}
          add-paths: |
            package.json
            package-lock.json
            CHANGELOG.md
          title: Release v${{ steps.bump.outputs.version }}
          body: |
            Automated version bump to `v${{ steps.bump.outputs.version }}`.

            Review the `CHANGELOG.md` entries before merging. Once merged, **Build and Release** builds the .deb and
            the Proxmox template, boot-tests the template and publishes the GitHub release.
          labels: release
