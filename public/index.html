<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AirScribe</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="overlay" id="login" hidden>
  <form class="card" id="login-form">
    <h1>AirScribe</h1>
    <h2>Sign in</h2>
    <div class="field" id="login-user-field" hidden>
      <label for="login-user">Username</label>
      <input id="login-user" autocomplete="username">
    </div>
    <div class="field">
      <label for="login-pass" id="login-pass-label">Password</label>
      <input id="login-pass" type="password" autocomplete="current-password">
    </div>
    <p class="meta" id="login-hint"></p>
    <p class="error" id="login-error"></p>
    <button type="submit">Sign in</button>
  </form>
</div>
<header><h1>AirScribe</h1><span id="conn" class="pill">connecting…</span>
  <span class="spacer"></span><button id="admin-toggle" hidden>Admin</button>
  <button id="logout" hidden>Sign out</button></header>
<main id="main" hidden>
  <section id="radios-panel">
    <div class="row"><h2>Radios</h2><button id="scan">Scan for radios</button></div>
    <ul id="radios"></ul>
    <div id="found" hidden>
      <h3>Found</h3>
      <ul id="found-list"></ul>
    </div>
  </section>
  <section id="feed-panel">
    <div class="row">
      <h2>Transmissions</h2>
      <select id="filter-radio"><option value="">All radios</option></select>
      <input id="search" type="search" placeholder="Search text…">
      <a id="export" class="export" download>Export</a>
    </div>
    <ul id="feed"></ul>
  </section>
</main>
<section id="admin" hidden>
  <div class="row"><h2>Admin</h2></div>
  <div class="panel">
    <div class="row"><h3>Updates</h3><button id="updates-check">Check now</button></div>
    <div id="updates"><p class="meta">Loading…</p></div>
  </div>
</section>
<script src="app.js" type="module"></script>
<script src="admin.js" type="module"></script>
</body>
</html>
